[package]
name = "caelestia"
version = "1.1.3"
edition = "2024"
description = "The caelestia CLI: colour schemes, app themes, wallpapers, the shell and screen recording"
license = "GPL-3.0-only"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff"] }
imagesize = "0.14"
material-colors = { version = "0.5", features = ["quantize"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
