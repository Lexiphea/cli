[package]
name = "caelestia"
version = "1.1.3"
edition = "2024"
description = "The caelestia CLI: colour schemes, app themes, wallpapers, the shell and screen recording"
license = "GPL-3.0-only"

[dependencies]
imagesize = "0.14"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
