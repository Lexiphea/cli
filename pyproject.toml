[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caelestia"
# Vendored from upstream v1.1.3, so there are no git tags to derive the version from
version = "1.1.3"
requires-python = ">=3.13"
dependencies = [
    "pillow",
    "materialyoucolor"
]

[project.scripts]
caelestia-py = "caelestia:main"

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "completions",
    "README.md"
]

[tool.ruff]
line-length = 120
